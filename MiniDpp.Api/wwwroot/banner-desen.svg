<svg xmlns="http://www.w3.org/2000/svg" width="640" height="280" viewBox="0 0 640 280">
  <defs>
    <pattern id="diag" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(28)">
      <rect width="10" height="10" fill="#12362c"/>
      <rect width="4" height="10" fill="#2d6452"/>
      <rect x="4" width="1.2" height="10" fill="#0c241e"/>
      <rect x="7" width="1.6" height="10" fill="#3d7a64"/>
    </pattern>
    <pattern id="capraz" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(-62)">
      <rect width="14" height="14" fill="none"/>
      <rect width="1" height="14" fill="#2ee6c0" fill-opacity="0.16"/>
    </pattern>
  </defs>
  <rect width="640" height="280" fill="url(#diag)"/>
  <rect width="640" height="280" fill="url(#capraz)"/>
</svg>
